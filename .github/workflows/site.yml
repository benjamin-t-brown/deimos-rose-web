name: Site

# The documentation site is generated, never edited: src/site/build.mjs
# turns src/site/site.config.json, the plugin folders and the releases
# API into pages.
#
# On this fork that site is not what GitHub Pages serves. The Pages URL
# is the playable game, published by web-build.yml on a push to main
# (D88). A Pages deploy here would replace the game, because GitHub
# Pages keeps one site per repository. This workflow builds the docs
# and uploads them as an ordinary artifact. It must not call
# configure-pages, upload-pages-artifact or deploy-pages.
#
# It runs once Build has finished on main rather than on the push
# itself: Build publishes the release whose zips the download links
# would point at, and a site built at push time would still link the
# one before. A release published with GITHUB_TOKEN triggers no
# workflow, but workflow_run does.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit Build ran on, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate the site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node src/site/build.mjs --out _site

      - uses: actions/upload-artifact@v4
        with:
          name: deimos-docs
          path: _site
          if-no-files-found: error
