name: Web Build

# Builds the browser game and, on a push of a cursor/web-* branch (or a
# manual run), publishes it to GitHub Pages when a Pages site exists.
#
# That publication replaces the whole Pages site. The documentation site
# (.github/workflows/site.yml) deploys to the same place after Build
# finishes on main, and whichever ran last is what the URL serves. This
# workflow is the test deploy of the game.
#
# Pages has to be set to "GitHub Actions" in the repository settings
# (Settings → Pages → Build and deployment → Source). The Actions token
# cannot create that site, so until it exists the deploy job warns and
# succeeds; the build is still uploaded as the deimos-web artifact. The
# published site must stay under 1 GB
# (docs.github.com/pages/getting-started-with-github-pages/github-pages-limits).

on:
  push:
    branches: ['cursor/web-*']
  pull_request:
    paths:
      - 'src/game_web/**'
      - 'src/all_plugins/**'
      - 'src/all_plugins_no_netplay/**'
      - 'src/web/**'
      - 'src/data/**'
      - 'src/third_party/odecs/**'
      - 'src/game/web.odin'
      - 'src/build_web.sh'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:

# A newer push of the same branch replaces a deploy that has not finished.
# A separate group from site.yml, so the two do not cancel each other.
concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_DISABLE_TOOLS: java

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin Odin for this run only
        run: printf '[tools]\nodin = "dev-2026-09"\n' > mise.local.toml

      - uses: jdx/mise-action@v2
        with:
          working_directory: src

      - run: odin version

      # libraylib.web.a ships as LLVM bitcode inside Odin. emcc has to be
      # near the Emscripten that produced it; `latest` tracks that better
      # than a pin from before this Odin.
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: 'emsdk-cache'

      - name: Verify emcc
        run: emcc --version

      - name: Build for web
        run: bash build_web.sh

      - name: List the web build
        run: |
          find build/web -type f -printf '%s\t%p\n' | sort -n
          du -sh build/web

      - uses: actions/upload-artifact@v4
        with:
          name: deimos-web
          path: src/build/web
          if-no-files-found: error

      # The Pages artifact is uploaded on the builds that deploy. A pull
      # request only keeps the downloadable artifact above.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: src/build/web

  deploy-pages:
    needs: build-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Creating a Pages site is an administration call, which GITHUB_TOKEN
      # is not allowed to make. A 404 here means the owner has not set
      # Source to GitHub Actions yet. The artifact from build-web is enough
      # until they do; the next push publishes.
      - name: See whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh api "repos/${{ github.repository }}/pages" --jq .html_url
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Settings → Pages → Build and deployment → Source → GitHub Actions. The web build is uploaded as the deimos-web artifact. The next push of this branch publishes it once that setting exists."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
