name: Web Build

# Build the web version (WASM) on every push to main or web-related branches.
# Optionally deploy to GitHub Pages (when enabled).

on:
  push:
    branches: ['main', 'cursor/web-*']
  pull_request:
    paths:
      - 'src/game_web/**'
      - 'src/all_plugins/**'
      - 'src/game/web.odin'
      - 'src/build_web.sh'
      - '.github/workflows/web-build.yml'
  workflow_dispatch:

env:
  MISE_DISABLE_TOOLS: java

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Odin via mise
      - name: Pin Odin for this run only
        run: printf '[tools]\nodin = "dev-2026-09"\n' > mise.local.toml

      - uses: jdx/mise-action@v2
        with:
          working_directory: src

      - run: odin version

      # Emscripten SDK
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.51'
          actions-cache-folder: 'emsdk-cache'

      - name: Verify emcc
        run: emcc --version

      # Build web version
      - name: Build for web
        run: bash build_web.sh

      # Create artifact
      - name: Package web build
        run: |
          cd build/web
          tar -czf ../../deimos-web.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: deimos-web
          path: src/deimos-web.tar.gz
          if-no-files-found: error

  # Optional: Deploy to GitHub Pages
