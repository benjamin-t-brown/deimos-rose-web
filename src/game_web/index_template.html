<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Deimos Rose</title>
	<meta name="title" content="Deimos Rose">
	<meta name="description" content="Deimos Rising reimplemented in Odin + Raylib">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: #000;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
		}
		canvas.game_canvas {
			border: 0;
			background-color: #000;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			display: block;
			margin: 0 auto;
		}
		#loading {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #fff;
			text-align: center;
			font-size: 18px;
		}
		#loading-bar {
			width: 300px;
			height: 20px;
			background: #333;
			border: 2px solid #666;
			margin: 20px auto;
			overflow: hidden;
		}
		#loading-progress {
			height: 100%;
			background: linear-gradient(90deg, #0080ff, #00c0ff);
			width: 0%;
			transition: width 0.3s;
		}
		.info {
			position: absolute;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			color: #888;
			font-size: 12px;
			text-align: center;
		}
		.info a {
			color: #0080ff;
			text-decoration: none;
		}
		.info a:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div>Loading Deimos Rose...</div>
		<div id="loading-bar">
			<div id="loading-progress"></div>
		</div>
		<div id="loading-status">Initializing...</div>
	</div>
	<canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>
	<div class="info">
		Deimos Rose &middot; <a href="https://github.com/Keristero/deimos-rose" target="_blank">GitHub</a>
	</div>
	
	<script type="text/javascript" src="odin.js"></script>
	<script>
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		var loadingDiv = document.getElementById('loading');
		var loadingProgress = document.getElementById('loading-progress');
		var loadingStatus = document.getElementById('loading-status');

		// The Module is used as configuration for emscripten.
		var Module = {
			// This is called by emscripten when it starts up.
			instantiateWasm: (imports, successCallback) => {
				const newImports = {
					...odinImports,
					...imports
				}

				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			
			// Track loading progress
			setStatus: function(text) {
				if (!text) {
					loadingDiv.style.display = 'none';
					return;
				}
				loadingStatus.textContent = text;
			},
			
			totalDependencies: 0,
			monitorRunDependencies: function(left) {
				this.totalDependencies = Math.max(this.totalDependencies, left);
				var percent = this.totalDependencies > 0 
					? Math.round((this.totalDependencies - left) / this.totalDependencies * 100)
					: 100;
				loadingProgress.style.width = percent + '%';
				
				if (left === 0) {
					loadingStatus.textContent = 'Starting game...';
				} else {
					loadingStatus.textContent = 'Loading assets (' + left + ' remaining)...';
				}
			},
			
			// This happens a bit after `instantiateWasm`, when everything is done setting up.
			onRuntimeInitialized: () => {
				var e = wasmExports;

				// Calls any procedure marked with @init
				e._start();

				// See game_web/main_web.odin for main_start, main_update and main_end.
				e.main_start();

				function send_resize() {
					var canvas = document.getElementById('canvas');
					e.web_window_size_changed(canvas.width, canvas.height);
				}

				window.addEventListener('resize', function(event) {
					send_resize();
				}, true);

				// This can probably be done better: Ideally we'd feed the
				// initial size to `main_start`. But there seems to be a
				// race condition. `canvas` doesn't have its correct size yet.
				send_resize();

				// Hide the loading screen and the footer link. The link would sit
				// on top of the play field.
				loadingDiv.style.display = 'none';
				var info = document.querySelector('.info');
				if (info) info.style.display = 'none';

				// Runs the "main loop".
				function do_main_update() {
					if (!e.main_update()) {
						e.main_end();

						// Calls procedures marked with @fini
						e._end();
						return;
					}
					window.requestAnimationFrame(do_main_update);
				}

				window.requestAnimationFrame(do_main_update);
			},
			
			print: (function() {
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
				};
			})(),
			
			printErr: function(text) {
				if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
				console.error(text);
			},
			
			canvas: (function() {
				return document.getElementById("canvas");
			})()
		};
	</script>

	<!-- Emscripten injects its javascript here -->
	{{{ SCRIPT }}}
</body>
</html>
