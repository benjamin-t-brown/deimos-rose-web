<!doctype html>
<html lang="en-us">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Deimos Rose</title>
	<meta name="title" content="Deimos Rose">
	<meta name="description" content="Deimos Rising reimplemented in Odin + Raylib">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: #000;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
		}
		canvas.game_canvas {
			border: 0;
			background-color: #000;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
			display: block;
			margin: 0 auto;
		}
		#loading {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #fff;
			text-align: center;
			font-size: 18px;
		}
		#loading-bar {
			width: 300px;
			height: 20px;
			background: #333;
			border: 2px solid #666;
			margin: 20px auto;
			overflow: hidden;
		}
		#loading-progress {
			height: 100%;
			background: linear-gradient(90deg, #0080ff, #00c0ff);
			width: 0%;
			transition: width 0.3s;
		}
		.info {
			position: absolute;
			bottom: 20px;
			left: 50%;
			transform: translateX(-50%);
			color: #888;
			font-size: 12px;
			text-align: center;
		}
		.info a {
			color: #0080ff;
			text-decoration: none;
		}
		.info a:hover {
			text-decoration: underline;
		}
	</style>
</head>
<body>
	<div id="loading">
		<div>Loading Deimos Rose...</div>
		<div id="loading-bar">
			<div id="loading-progress"></div>
		</div>
		<div id="loading-status">Initializing...</div>
	</div>
	<canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>
	<div class="info">
		Deimos Rose &middot; <a href="https://github.com/Keristero/deimos-rose" target="_blank">GitHub</a>
	</div>
	
	<script type="text/javascript" src="odin.js"></script>
	<script>
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		var loadingDiv = document.getElementById('loading');
		var loadingProgress = document.getElementById('loading-progress');
		var loadingStatus = document.getElementById('loading-status');

		// The Module is used as configuration for emscripten.
		var Module = {
			// This is called by emscripten when it starts up.
			instantiateWasm: (imports, successCallback) => {
				const newImports = {
					...odinImports,
					...imports
				}

				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			
			// Track loading progress
			setStatus: function(text) {
				if (!text) {
					loadingDiv.style.display = 'none';
					return;
				}
				loadingStatus.textContent = text;
			},
			
			totalDependencies: 0,
			monitorRunDependencies: function(left) {
				this.totalDependencies = Math.max(this.totalDependencies, left);
				var percent = this.totalDependencies > 0 
					? Math.round((this.totalDependencies - left) / this.totalDependencies * 100)
					: 100;
				loadingProgress.style.width = percent + '%';
				
				if (left === 0) {
					loadingStatus.textContent = 'Starting game...';
				} else {
					loadingStatus.textContent = 'Loading assets (' + left + ' remaining)...';
				}
			},
			
			// This happens a bit after `instantiateWasm`, when everything is done setting up.
			onRuntimeInitialized: () => {
				var e = wasmExports;

				// IndexedDB copy of /persist. main_start reads saves, so the
				// load has to finish first. drSync is what the game calls
				// after it writes. Calls queue: a second syncfs while one
				// is running is an error in Emscripten.
				if (!Module.drPersist) Module.drPersist = {pending: 0, error: '', q: [], busy: false};
				Module.drPersistFailed = 0;
				Module.drPump = function() {
					var p = Module.drPersist;
					if (p.busy || p.q.length === 0) return;
					var job = p.q.shift();
					p.busy = true;
					Module.FS.syncfs(job.populate, function(err) {
						p.busy = false;
						p.pending = Math.max(0, p.pending - 1);
						p.error = err ? String(err) : '';
						if (err) Module.drPersistFailed = 1;
						if (job.done) job.done(err);
						Module.drPump();
					});
				};
				Module.drSync = function(populate, done) {
					Module.drPersist.pending++;
					Module.drPersist.q.push({populate: !!populate, done: done});
					Module.drPump();
				};

				function send_resize() {
					var canvas = document.getElementById('canvas');
					e.web_window_size_changed(canvas.width, canvas.height);
				}

				window.addEventListener('resize', function(event) {
					send_resize();
				}, true);

				// A write already calls drSync. This catches a close that
				// races the one still in flight.
				window.addEventListener('pagehide', function() {
					if (typeof Module.drSync === 'function') Module.drSync(false, null);
				});

				function start_game() {
					// Calls any procedure marked with @init
					e._start();
					try { Module.FS.mkdir('/persist/deimos-rising'); } catch (err) {}
					e.main_start();
					// The canvas may not have its size yet at the first call.
					send_resize();
					loadingDiv.style.display = 'none';
					var info = document.querySelector('.info');
					if (info) info.style.display = 'none';
					function do_main_update() {
						if (!e.main_update()) {
							e.main_end();
							e._end();
							return;
						}
						window.requestAnimationFrame(do_main_update);
					}
					window.requestAnimationFrame(do_main_update);
				}

				try { Module.FS.mkdir('/persist'); } catch (err) {}
				Module.FS.mount(Module.IDBFS, {}, '/persist');
				Module.drSync(true, function(err) {
					if (err) console.error('save load', err);
					start_game();
				});
			},
			
			print: (function() {
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
				};
			})(),
			
			printErr: function(text) {
				if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
				console.error(text);
			},
			
			canvas: (function() {
				return document.getElementById("canvas");
			})()
		};
	</script>

	<!-- Emscripten injects its javascript here -->
	{{{ SCRIPT }}}
</body>
</html>
